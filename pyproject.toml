[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "switchroute-gateway"
version = "0.4.0"
description = "SwitchRoute intelligent capacity routing gateway"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.3",
  "asyncpg==0.30.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "litellm==1.98.0",
  "orjson==3.12.0",
  "pydantic-settings==2.15.0",
  "redis==6.4.0",
  "uvicorn[standard]==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services/gateway/src/switchroute"]

[tool.vercel]
entrypoint = "services.gateway.main:app"
