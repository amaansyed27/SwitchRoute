name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000/v1
      GATEWAY_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build:web
      - run: npm audit --audit-level=high
      - run: npm run check:files

  gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      - run: python -c "import tomllib, pathlib; local=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); root=tomllib.loads(pathlib.Path('../../pyproject.toml').read_text()); assert sorted(local['project']['dependencies']) == sorted(root['project']['dependencies']), 'root pyproject.toml must mirror services/gateway runtime dependencies'"
      - run: ruff check --config pyproject.toml src tests ../../scripts/export_openapi.py
      - run: pyright
      - run: pytest -q
      - run: python ../../scripts/export_openapi.py --check
      - run: python -c "import json; d=json.load(open('../../packages/api-contract/openapi.json')); assert '/v1/chat/completions' in d['paths']; assert '/v1/models' in d['paths']"
      - run: pip-audit --local

  edge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/switchroute-edge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/switchroute-edge
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
