name: Preview source bundle

on:
  push:
    branches:
      - slice/ui-ux-redesign
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package preview source
        run: tar -czf /tmp/switchroute-preview-source.tgz --exclude=.git --exclude=node_modules .
      - uses: actions/upload-artifact@v4
        with:
          name: switchroute-preview-source
          path: /tmp/switchroute-preview-source.tgz
          retention-days: 1

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture live preview
        env:
          PREVIEW: https://switchroute-ui-preview-v2-f5arme1ja-amaan-syeds-projects.vercel.app
          SHARE: _vercel_share=nI2xn6OiAyXx7Rkemttdg4BjlUidqsQr
        run: |
          mkdir -p screenshots
          npx playwright screenshot --browser=chromium --viewport-size="1440,1000" "$PREVIEW/?$SHARE" screenshots/home-desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1000" --full-page "$PREVIEW/?$SHARE" screenshots/home-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1000" "$PREVIEW/docs/getting-started?$SHARE" screenshots/docs-desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1000" "$PREVIEW/login?$SHARE" screenshots/login-desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" "$PREVIEW/?$SHARE" screenshots/home-mobile.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" "$PREVIEW/docs/getting-started?$SHARE" screenshots/docs-mobile.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" "$PREVIEW/login?$SHARE" screenshots/login-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchroute-preview-screenshots
          path: screenshots
          retention-days: 1
