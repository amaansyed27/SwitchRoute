name: Finalize Slice 1 artifacts

on:
  push:
    branches: [slice/cloud-core]
    paths:
      - .github/workflows/finalize-slice1.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/cloud-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./services/gateway[dev]"
      - run: python scripts/export_openapi.py
      - name: Commit generated artifacts and remove one-time workflow
        run: |
          rm .github/workflows/finalize-slice1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/api-contract/openapi.json .github/workflows/finalize-slice1.yml
          git commit -m "chore: finalize Slice 1 generated artifacts"
          git push origin HEAD:slice/cloud-core
