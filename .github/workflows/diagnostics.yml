name: CI diagnostics

on:
  push:
    branches: [slice/cloud-core]

permissions:
  contents: read

jobs:
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture web lint
        shell: bash
        run: npm run lint > web-lint.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-lint-log
          path: web-lint.log

  gateway-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Capture gateway install
        shell: bash
        run: pip install -e "./services/gateway[dev]" pip-audit > gateway-install.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-install-log
          path: gateway-install.log
