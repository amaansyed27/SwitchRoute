name: CI diagnostics

on:
  push:
    branches: [slice/cloud-core]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture web tests
        run: npm run test:web > web-tests.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-tests-log
          path: web-tests.log

  gateway-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./services/gateway[dev]"
      - name: Capture Ruff
        run: ruff check services/gateway/src services/gateway/tests scripts/export_openapi.py > gateway-ruff.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-ruff-log
          path: gateway-ruff.log
