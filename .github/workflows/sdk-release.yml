name: SDK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish both SDK packages after build/test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pyright
      - run: pytest -q
      - run: python -m build
      - name: Install wheel smoke test
        run: |
          python -m venv /tmp/sr-sdk-smoke
          /tmp/sr-sdk-smoke/bin/pip install dist/*.whl
          /tmp/sr-sdk-smoke/bin/python -c "from switchroute import SwitchRoute; print(SwitchRoute)"
      - uses: actions/upload-artifact@v4
        with:
          name: switchroute-python-dist
          path: sdk/python/dist/*
      - name: Publish to PyPI
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: switchroute-js-dist
          path: sdk/javascript/*.tgz
      - name: Publish to npm
        if: ${{ inputs.publish }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
