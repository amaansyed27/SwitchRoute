[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "switchroute-gateway"
version = "0.1.0"
description = "SwitchRoute Cloud Core gateway"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.30.0",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "litellm==1.98.0",
  "orjson==3.11.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pyright==1.1.403",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/switchroute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
