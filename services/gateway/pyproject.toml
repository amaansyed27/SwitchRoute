[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "switchroute-gateway"
version = "0.2.0"
description = "SwitchRoute intelligent capacity routing gateway"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.30.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "litellm==1.98.0",
  "orjson==3.12.0",
  "pydantic-settings==2.15.0",
  "redis==6.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pyright==1.1.403",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/switchroute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
