[package]
name = "switchroute-edge"
version = "0.3.0"
edition = "2021"
publish = false
description = "Local SwitchRoute Edge routing daemon"
license = "MIT"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["json"] }
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.31"
hex = "0.4.3"
keyring = "4.0.0"
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.21.0"
